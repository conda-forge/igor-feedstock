schema_version: 1

context:
  name: igor
  version: 0.3

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b04ac38c68fb81cf3167a9981dc5a20379112d40268bb72c5a8514dc8051abba
  patches:
    - git_patch.patch

build:
  number: 4
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - igorbinarywave = bin.igorbinarywave:main
      - igorpackedexperiment = bin.igorpackedexperiment:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base

tests:
  - python:
      imports:
        - igor.binarywave
        - igor.packed
        - igor.igorpy
      pip_check: false
      python_version: ${{ python_min }}.*
  - script:
      - igorbinarywave --help
      - igorpackedexperiment --help

about:
  license: LGPL-3.0-only
  license_file: COPYING.LESSER
  summary: Python parsers for WaveMetrics Igor Binary Waves and Packed Experiment files
  description: |
    Python parsers for Igor Binary Waves (.ibw) and Packed Experiment
    (.pxp) files written by WaveMetrics' IGOR Pro software.
  homepage: http://blog.tremily.us/posts/igor/
  repository: http://blog.tremily.us/posts/igor/
  documentation: http://git.tremily.us/?p=igor.git;a=blob_plain;f=README;hb=HEAD

extra:
  recipe-maintainers:
    - carlodri
